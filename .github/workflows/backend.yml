name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: creatoros
          POSTGRES_PASSWORD: creatoros
          POSTGRES_DB: creatoros_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U creatoros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches tests/conftest.py's default exactly (host/port/db) so no
      # per-job override is needed - conftest already forces stub-mode
      # model keys and a fresh schema per test.
      DATABASE_URL: postgresql+asyncpg://creatoros:creatoros@localhost:5544/creatoros_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: PGPASSWORD=creatoros psql -h localhost -p 5544 -U creatoros -d creatoros_test -c "create extension if not exists vector;"

      - name: Run tests
        run: pytest -q
